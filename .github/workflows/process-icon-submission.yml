name: Process Icon Submission

on:
  repository_dispatch:
    types: [process-icon-submission]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Process icon submission
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          ICON_SLUG: ${{ github.event.client_payload.slug }}
          ICON_TITLE: ${{ github.event.client_payload.title }}
          ICON_HEX: ${{ github.event.client_payload.hex }}
          ICON_HEXES: ${{ toJson(github.event.client_payload.hexes) }}
          ICON_LICENSE: ${{ github.event.client_payload.license }}
          ICON_URL: ${{ github.event.client_payload.url }}
          ICON_CATEGORIES: ${{ toJson(github.event.client_payload.categories) }}
          ICON_ALIASES: ${{ toJson(github.event.client_payload.aliases) }}
          ICON_VARIANTS: ${{ toJson(github.event.client_payload.variants) }}
        run: node scripts/process-submission.js

      - name: Regenerate metadata
        run: node scripts/generate-metadata.js

      - name: Commit and push icon files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/icons/ public/icons.json public/icons-metadata.json public/icons-paths.json
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit — icon may already exist."
          else
            SLUG="${{ github.event.client_payload.slug }}"
            TITLE="${{ github.event.client_payload.title }}"
            git commit -m "feat(icons): add ${TITLE} (${SLUG})"
            git push
            echo "[SUCCESS] Icon committed and pushed!"
          fi

      - name: Update submission status in Supabase
        if: env.SUBMISSION_ID != '' && env.SUBMISSION_ID != 'null'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/icon_submissions?id=eq.$SUBMISSION_ID" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "merged", "processed_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
          echo "[SUCCESS] Submission status updated to merged"

  on-failure:
    runs-on: ubuntu-latest
    needs: process
    if: failure()
    steps:
      - name: Update submission status to failed
        if: github.event.client_payload.submission_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/icon_submissions?id=eq.$SUBMISSION_ID" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "rejected", "error_message": "Automated processing failed"}'
